# Included from nginx.conf's http {} scope by Debian's conf.d include.
# Deliberately excludes Authorization, request bodies, destinations, client IPs,
# user agents, and referers. `request_id` correlates with Rust journald events.
log_format external_shortlink_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"component":"external_shortlink_nginx",'
    '"event":"http_request",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"request_time_seconds":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time_seconds":"$upstream_response_time",'
    '"bytes_sent":$bytes_sent}';
