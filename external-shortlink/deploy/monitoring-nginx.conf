# Included inside the jzbe.ir TLS server. Never replace the allowlist with
# `allow all`: metrics reveal operational state.
location = /metrics {
    allow 127.0.0.1;
    allow ::1;
    # allow MONITORING_SOURCE_IP;
    deny all;
    proxy_pass http://127.0.0.1:8081;
    include proxy_params;
}

location = /node-metrics {
    allow 127.0.0.1;
    allow ::1;
    # allow MONITORING_SOURCE_IP;
    deny all;
    proxy_pass http://127.0.0.1:9100/metrics;
    include proxy_params;
}
