# PostgreSQL only. The Rust service runs directly under systemd.
services:
  postgres:
    image: docker.io/library/postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
    restart: unless-stopped
    init: true
    env_file:
      - /etc/external-shortlink-postgres.env
    ports:
      - "127.0.0.1:5433:5432"
    command:
      - postgres
      - -c
      - max_connections=32
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=2GB
      - -c
      - wal_compression=on
      - -c
      - 'log_line_prefix=external_shortlink_postgres ts=%m pid=%p db=%d user=%u app=%a client=%h '
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    shm_size: 512mb
    mem_limit: 1536m
    cpus: 2.5
    security_opt:
      - no-new-privileges:true
    volumes:
      - external_shortlink_postgres:/var/lib/postgresql/data
      # The deployment script applies these only after PostgreSQL is ready.
      # Do not mount them below /docker-entrypoint-initdb.d: its automatic
      # first-boot execution conflicts with the deployment's idempotent setup.
      - ../schema.sql:/opt/external-shortlink-schema.sql:ro
      - ./postgres-init/20-runtime-role.sh:/opt/external-shortlink-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --port 5432 -U external_shortlink_admin -d external_shortlink"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  external_shortlink_postgres:
