# The deployment script replaces the production source IP before activating this file.
# This file assumes Nginx is the only process allowed to reach the Rust service.
limit_req_zone $binary_remote_addr zone=shortlink_admin:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name jzbe.ir;

    # Keep HTTP-01 renewal independent of HTTPS certificate state.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/external-shortlink-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://jzbe.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jzbe.ir;

    ssl_certificate /etc/letsencrypt/live/jzbe.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jzbe.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/external-shortlink.access.log external_shortlink_json;
    error_log /var/log/nginx/external-shortlink.error.log warn;
    client_max_body_size 16m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    # Installed as loopback-only by default; setup-monitoring-debian-12.sh
    # replaces the placeholder with the Prometheus host's egress IP.
    include /etc/nginx/snippets/external-shortlink-monitoring.conf;

    location ^~ /api/ {
        # When --production-ip is supplied, the deployment script adds its
        # source-IP allowlist and denies every other remote address. Without
        # it, bearer-token authentication remains the only access control.
        allow 127.0.0.1;
        allow ::1;
        # EXTERNAL_SHORTLINK_API_SOURCE_RULE
        # EXTERNAL_SHORTLINK_API_DENY_RULE
        limit_req zone=shortlink_admin burst=40 nodelay;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite rather than append: only this local proxy is trusted.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }
}
