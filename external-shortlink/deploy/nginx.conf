# This file assumes Nginx is the only process allowed to reach the Rust service.
server {
    listen 80;
    listen [::]:80;
    server_name jzbe.ir;

    # Keep HTTP-01 renewal independent of HTTPS certificate state.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/external-shortlink-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://jzbe.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jzbe.ir;

    ssl_certificate /etc/letsencrypt/live/jzbe.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jzbe.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/external-shortlink.access.log;
    error_log /var/log/nginx/external-shortlink.error.log warn;
    client_max_body_size 16m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        # allow MONITORING_SERVER_IP;
        deny all;
        proxy_pass http://127.0.0.1:8081;
        include proxy_params;
    }

    location ^~ /api/ {
        # The API is bearer-token authenticated. The Rust server also applies
        # bounded request bodies and proxy timeouts below.
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_http_version 1.1;
        proxy_connect_timeout 1s;
        # A redirect may make three bounded durable-write attempts (just over
        # six seconds in the deployment configuration). Keep the proxy deadline
        # above that bound so a client never receives a gateway timeout while a
        # click can still commit in the application.
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite rather than append: only this local proxy is trusted.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
