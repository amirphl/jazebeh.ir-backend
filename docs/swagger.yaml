  /api/v1/bundles/{id}/smart-targeting/tags:
    get:
      description: Returns a page of tags for an owned bundle before a campaign exists,
        including materialized Bundle/tag Test totals and CTR plus global overall
        CTR. When current score rows exist, their tag and score snapshots are authoritative;
        otherwise the endpoint falls back to active live tags with null evaluation
        fields. selected_tag_ids and the selection summary are empty; submit chosen
        IDs with campaign creation.
      parameters:
      - description: Owned bundle ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Case-insensitive tag name or display-title search (maximum 200
          characters)
        in: query
        name: search
        type: string
      - description: Return tags with capacity strictly greater than this value
        in: query
        minimum: 0
        name: capacity
        type: integer
      - description: Sort field. bundle_persona_fit_score requires a completed bundle
          evaluation.
        enum:
        - tag_capacity
        - bundle_persona_fit_score
        - test_phase_avg_ctr
        - overall_avg_ctr
        in: query
        name: sort_by
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: sort_direction
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page; limit is accepted as a backward-compatible alias
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: Backward-compatible alias for page_size; ignored when page_size
          is supplied
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Available tag page
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ListSmartTargetingTagsResponse'
              type: object
        "400":
          description: Invalid bundle ID, capacity, pagination, search, or sort; persona
            score unavailable
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Bundle belongs to another customer
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Bundle not found
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Tag or evaluation lookup failed
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: List bundle Smart Targeting tags
      tags:
      - Bundles
