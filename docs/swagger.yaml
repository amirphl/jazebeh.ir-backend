  /api/v1/campaigns/{uuid}/smart-targeting/tags:
    get:
      description: Returns a page of tags for an owned campaign, each row's selected
        state, materialized Bundle/tag Test CTR, global overall CTR, nullable per-Campaign
        Test totals and CTR, the complete selected_tag_ids set across all pages, and
        the complete selection capacity summary. Execution Campaigns default to Test
        CTR descending, then persona-fit score descending, then database order. When
        the bundle has current score rows, tag names, display titles, personas, capacities,
        fit scores, and score explanations come from that completed evaluation snapshot.
        Otherwise active live tags are returned and evaluation fields are null.
      parameters:
      - description: Owned campaign UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: Case-insensitive tag name or display-title search (maximum 200
          characters)
        in: query
        name: search
        type: string
      - description: Return tags with capacity strictly greater than this value
        in: query
        minimum: 0
        name: capacity
        type: integer
      - description: Sort field. bundle_persona_fit_score requires a completed bundle
          evaluation.
        enum:
        - tag_capacity
        - bundle_persona_fit_score
        - test_phase_avg_ctr
        - overall_avg_ctr
        in: query
        name: sort_by
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: sort_direction
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page; limit is accepted as a backward-compatible alias
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: Backward-compatible alias for page_size; ignored when page_size
          is supplied
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Tag page and complete selection state
          schema:
            allOf:
            - $ref: '#/definitions/dto.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ListSmartTargetingTagsResponse'
              type: object
        "400":
          description: Invalid UUID, capacity, pagination, search, or sort; persona
            score unavailable
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Campaign belongs to another customer
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Campaign or bundle not found
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Tag, evaluation, or selection lookup failed
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: List Smart Targeting tags
      tags:
      - Campaigns
