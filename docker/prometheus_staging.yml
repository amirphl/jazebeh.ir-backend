global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: staging

scrape_configs:
  - job_name: yamata_app
    static_configs:
      - targets: ['app-beta:9090']
  - job_name: yamata_campaign_scheduler
    static_configs:
      - targets: ['campaign-scheduler-beta:9091']
  - job_name: postgres_exporter
    static_configs:
      - targets: ['postgres-exporter-beta:9187']
  - job_name: node_exporter
    static_configs:
      - targets: ['node-exporter-beta:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor-beta:8080']
