# Upstream definitions for beta environment
upstream yamata_backend {
    least_conn;
    server app-beta:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream yamata_metrics {
    server app-beta:9090 max_fails=3 fail_timeout=30s;
}

upstream frontend {
    server frontend-beta:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream sentry_ui {
    server sentry-beta:8000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name landing.${DOMAIN};

    if ($block_proxy_method) { return 405; }
    if ($block_absolute_uri) { return 400; }
    if ($has_proxy_header) { return 400; }

    return 301 https://${DOMAIN}/landing$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    if ($block_proxy_method) { return 405; }
    if ($block_absolute_uri) { return 400; }
    if ($has_proxy_header) { return 400; }

    return 301 https://${DOMAIN}$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN} landing.${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

    limit_conn conn_limit_per_ip 100;

    if ($block_proxy_method) { return 405; }
    if ($block_absolute_uri) { return 400; }
    if ($has_proxy_header) { return 400; }

    if ($host = landing.${DOMAIN}) {
        return 301 https://${DOMAIN}/landing$request_uri;
    }

    location = /health {
        access_log off;
        proxy_pass http://yamata_backend/api/v1/health;
        include /etc/nginx/proxy.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://yamata_backend;
        include /etc/nginx/proxy.conf;
    }

    location = /api/v1/admin/short-links/upload-csv {
        client_max_body_size 50m;
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://yamata_backend;
        include /etc/nginx/proxy.conf;
    }

    # Allocation is a deliberately long-running bulk operation. It can carry
    # 200K+ recipients and waits for durable redirect-mapping acknowledgement.
    location = /api/v1/bot/short-links/allocate {
        client_max_body_size 100m;
        limit_req zone=api burst=20 nodelay;
        proxy_connect_timeout 30s;
        # The handler has a 50-minute budget and the scheduler client waits
        # 60 minutes. Keep a response-delivery margin at both boundaries.
        proxy_send_timeout 55m;
        proxy_read_timeout 55m;
        proxy_pass http://yamata_backend;
        include /etc/nginx/proxy.conf;
    }

    location ~ ^/api/v1/campaigns/[^/]+/smart-targeting/test-sampling-preview$ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://yamata_backend;
        include /etc/nginx/proxy.conf;
        proxy_connect_timeout 10s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
    }

    location ~ ^/api/v1/campaigns/[^/]+/click-report$ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://yamata_backend;
        include /etc/nginx/proxy.conf;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_max_temp_file_size 0;
    }

    location ~ ^/api/v1/campaigns/[^/]+$ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://yamata_backend;
        include /etc/nginx/proxy.conf;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api/v1/media/upload {
        client_max_body_size 100m;
        limit_req zone=api burst=100 nodelay;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://yamata_backend;
        include /etc/nginx/proxy.conf;
    }

    location ^~ /api/v1/media/ {
        limit_req zone=api burst=100 nodelay;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://yamata_backend;
        include /etc/nginx/proxy.conf;
    }

    location ~ ^/api/v1/bot/campaigns/[^/]+/audience-uids$ {
        client_max_body_size 100m;
        limit_req zone=api burst=100 nodelay;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://yamata_backend;
        include /etc/nginx/proxy.conf;
    }

    # Keep this regex catch-all after the more specific API regex locations.
    # A ^~ prefix here would prevent nginx from evaluating their overrides.
    location ~ ^/api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://yamata_backend;
        include /etc/nginx/proxy.conf;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow 172.30.0.0/24;
        deny all;

        proxy_pass http://yamata_metrics;
        include /etc/nginx/proxy.conf;
    }

    location ~ "\s" {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location ~* "(?:~|\.(?:bak|backup|bkp|copy|old|orig|original|save|saved|swp|swo|tmp|temp))$" {
        return 404;
    }

    location ~* "\.(?:conf|config|env|ini|log|sql|sqlite|sqlite3|db|ya?ml|xml|php|asp|aspx|jsp|cgi|pl|py|rb|sh|bash|bat|cmd|ps1|pem|key|crt|csr|p12|pfx|zip|tar|gz|bz2|rar|7z|npmrc|yarnrc)$" {
        return 404;
    }

    location ~* /(?:nginx_status|server[_-](?:info|status)|php[_-](?:info|status)|apache[_-](?:info|status)|mod_(?:info|status))$ {
        return 404;
    }

    location = / {
        limit_req zone=general burst=100 nodelay;
        access_log /var/log/nginx/frontend_access.log;
        error_log /var/log/nginx/frontend_error.log warn;
        proxy_pass http://frontend/;
        include /etc/nginx/proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback;
    }

    location = /favicon.ico {
        limit_req zone=general burst=100 nodelay;
        access_log off;
        log_not_found off;

        proxy_pass http://frontend;
        include /etc/nginx/proxy.conf;

        expires 30d;
        add_header Cache-Control "public" always;
        include /etc/nginx/security.conf;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://frontend;
        include /etc/nginx/proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security.conf;
    }

    location ~* \.(html|json|webmanifest)$ {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://frontend;
        include /etc/nginx/proxy.conf;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/security.conf;
    }

    location / {
        limit_req zone=general burst=100 nodelay;
        access_log /var/log/nginx/frontend_access.log;
        error_log /var/log/nginx/frontend_error.log warn;
        proxy_pass http://frontend;
        include /etc/nginx/proxy.conf;
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback;
    }

    location @fallback {
        default_type text/plain;
        return 503 "Service temporarily unavailable\n";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ${MONITORING_DOMAIN};

    if ($block_proxy_method) { return 405; }
    if ($block_absolute_uri) { return 400; }
    if ($has_proxy_header) { return 400; }

    return 301 https://${MONITORING_DOMAIN}$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${SENTRY_UI_DOMAIN};

    if ($block_proxy_method) { return 405; }
    if ($block_absolute_uri) { return 400; }
    if ($has_proxy_header) { return 400; }

    return 301 https://${SENTRY_UI_DOMAIN}$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SENTRY_UI_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

    client_max_body_size 20m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    if ($block_proxy_method) { return 405; }
    if ($block_absolute_uri) { return 400; }
    if ($has_proxy_header) { return 400; }

    location / {
        proxy_pass http://sentry_ui;
        include /etc/nginx/proxy.conf;
        # GlitchTip enables a compatible CSP by default. Preserve its policy
        # instead of replacing it with the public frontend's static policy.
        proxy_pass_header Content-Security-Policy;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${MONITORING_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

    if ($block_proxy_method) { return 405; }
    if ($block_absolute_uri) { return 400; }
    if ($has_proxy_header) { return 400; }

    location /prometheus/ {
        allow 127.0.0.1;
        allow 172.30.0.0/24;
        deny all;
        proxy_pass http://prometheus-beta:9090/;
        include /etc/nginx/proxy.conf;
    }

    location /grafana/ {
        limit_req zone=grafana burst=300 nodelay;
        proxy_pass http://grafana-beta:3000;
        include /etc/nginx/proxy.conf;
        # Grafana's built-in policy contains a fresh nonce for its inline
        # bootstrap code. It is enabled in docker-compose.beta.yml.
        proxy_pass_header Content-Security-Policy;
    }

    location /grafana/api/live/ {
        limit_req zone=grafana burst=300 nodelay;
        proxy_pass http://grafana-beta:3000;
        include /etc/nginx/proxy.conf;
        proxy_pass_header Content-Security-Policy;
    }

    location /metrics/ {
        allow 127.0.0.1;
        allow 172.30.0.0/24;
        deny all;
        proxy_pass http://yamata_metrics/;
        include /etc/nginx/proxy.conf;
    }

    location = /nginx_status {
        allow 127.0.0.1;
        allow 172.30.0.0/24;
        deny all;
        stub_status on;
        access_log off;
    }

    location = / {
        return 301 /grafana/;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name jaazebeh.ir www.jaazebeh.ir;

    if ($block_proxy_method) { return 405; }
    if ($block_absolute_uri) { return 400; }
    if ($has_proxy_header) { return 400; }

    return 301 https://jaazebeh.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jaazebeh.ir www.jaazebeh.ir;

    ssl_certificate /etc/letsencrypt/live/jaazebeh.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaazebeh.ir/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/jaazebeh.ir/chain.pem;

    root /var/www/jaazebeh;
    index home.html;

    if ($block_proxy_method) { return 405; }
    if ($block_absolute_uri) { return 400; }
    if ($has_proxy_header) { return 400; }

    location = / {
        try_files /home.html =404;
    }

    location = /contact {
        try_files /contact.html =404;
    }

    location = /contact.html {
        try_files /contact.html =404;
    }

    location ~ "\s" { return 404; }
    location ~ /\. { return 404; }
    location ~* "(?:~|\.(?:bak|backup|bkp|copy|old|orig|original|save|saved|swp|swo|tmp|temp))$" { return 404; }
    location ~* "\.(?:conf|config|env|ini|log|sql|sqlite|sqlite3|db|ya?ml|xml|php|asp|aspx|jsp|cgi|pl|py|rb|sh|bash|bat|cmd|ps1|pem|key|crt|csr|p12|pfx|zip|tar|gz|bz2|rar|7z|npmrc|yarnrc)$" { return 404; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        include /etc/nginx/security.conf;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

