# PostgreSQL Production Configuration for Yamata no Orochi

# Connection settings
listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'
max_connections = 200
superuser_reserved_connections = 3
# Older execution-reservation triggers took one transaction-scoped advisory
# lock per audience. Migration 0149 reduces that to one per Bundle, but keep a
# generous shared lock table for safe operation during mixed-version rollout
# and other large transactions. PostgreSQL allocates it at startup as roughly
# max_locks_per_transaction * (max_connections + max_prepared_transactions).
max_locks_per_transaction = 4096

# Memory settings
# The production host has 64 GiB of RAM. Keep shared buffers conservative
# enough to leave ample room for the kernel page cache and the application
# containers, while avoiding the previous 256 MiB cache bottleneck.
shared_buffers = 12GB
effective_cache_size = 48GB
work_mem = 4MB
maintenance_work_mem = 1GB
autovacuum_work_mem = 512MB
huge_pages = try

# Extensions and monitoring
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# WAL settings
wal_level = replica
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_buffers = -1

# Query tuning
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# Logging
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000
log_temp_files = 64MB
log_autovacuum_min_duration = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_lock_waits = on
log_statement = 'ddl'
log_connections = on
log_disconnections = on

# Performance monitoring
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl

# Security
# SSL configuration - disabled for internal Docker network
# ssl = on
# ssl_cert_file = 'server.crt'
# ssl_key_file = 'server.key'
ssl = off
password_encryption = scram-sha-256

# Autovacuum
autovacuum = on
autovacuum_max_workers = 5
autovacuum_naptime = 30s

# Locale and formatting
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
