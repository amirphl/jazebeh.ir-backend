name: yamata-no-orochi
networks:
  yamata-network-beta:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Only the dedicated pgAdmin Nginx proxy and pgAdmin join this network.
  # pgAdmin listens exclusively on this address, so no other service can reach
  # its HTTP UI.
  pgadmin-network-beta:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/28
  # The dedicated pgAdmin proxy needs an egress-capable interface solely to
  # receive Docker's published host port. It shares no network with app services.
  pgadmin-edge-network-beta:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/28
  # Only pgAdmin and PostgreSQL join this network. Keeping it separate from
  # yamata-network-beta prevents a compromised pgAdmin UI from reaching the
  # application, Redis, observability, or host-facing services.
  pgadmin-postgres-network-beta:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/28

volumes:
  postgres_data_beta:
    driver: local
  redi_data_beta:
    driver: local
  nginx_logs_beta:
    driver: local
  pgadmin_nginx_logs_beta:
    driver: local
  app_logs_beta:
    driver: local
  uploads_beta:
    driver: local
  prometheus_data_beta:
    driver: local
  grafana_data_beta:
    driver: local
  frontend_logs_beta:
    driver: local
  postgres_backups_beta:
    driver: local
  sentry_postgres_data_beta:
    driver: local
  sentry_redis_data_beta:
    driver: local
  pgadmin_data_beta:
    driver: local

secrets:
  # The source files are protected, Git-ignored files referenced by .env.beta.
  # Secrets are mounted only into the service that needs each one.
  pgadmin_default_password:
    file: ${PGADMIN_DEFAULT_PASSWORD_FILE:?PGADMIN_DEFAULT_PASSWORD_FILE must point to the pgAdmin password secret}
  pgadmin_nginx_htpasswd:
    file: ${PGADMIN_NGINX_HTPASSWD_FILE:?PGADMIN_NGINX_HTPASSWD_FILE must point to the pgAdmin Basic Auth htpasswd file}

services:
  # PostgreSQL Database
  postgres-beta:
    image: postgres:15-alpine
    container_name: yamata-postgres-beta
    restart: unless-stopped
    # PostgreSQL parallel queries use POSIX dynamic shared memory. Docker's
    # 64 MiB default is too small for audience-selection workloads.
    shm_size: ${POSTGRES_SHM_SIZE:-16gb}
    environment:
      TZ: UTC
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data_beta:/var/lib/postgresql/data
      - ./docker/postgres/init-beta-processed.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/init-database-beta-processed.sql:/docker-entrypoint-initdb.d/02-init-database.sql:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./migrations:/migrations:ro
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.10
      pgadmin-postgres-network-beta:
        ipv4_address: 172.29.0.2
        aliases:
          # This alias exists only on the pgAdmin-to-PostgreSQL network. Do
          # not use the application-network postgres-beta hostname in pgAdmin.
          - pgadmin-postgres
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # Redis Cache
  redis-beta:
    image: redis:8.0.3-alpine
    container_name: yamata-redis-beta
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redi_data_beta:/data
      # - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.11
    # command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      # test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # PostgreSQL backup scheduled daily at 00:00 UTC
  postgres-backup-beta:
    image: postgres:15-alpine
    container_name: yamata-postgres-backup-beta
    restart: unless-stopped
    depends_on:
      postgres-beta:
        condition: service_healthy
    environment:
      TZ: UTC
      DB_HOST: postgres-beta
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_HEALTH_MAX_AGE_SECONDS: ${BACKUP_HEALTH_MAX_AGE_SECONDS:-93600}
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        mkdir -p /backups
        export PGPASSWORD="$${DB_PASSWORD}"
        touch /backups/.scheduler-started
        last_scheduled_epoch=0
        while true; do
          now_epoch=$$(date -u +%s)
          current_midnight_epoch=$$((now_epoch - (now_epoch % 86400)))
          if [ "$${now_epoch}" -eq "$${current_midnight_epoch}" ] &&
             [ "$${current_midnight_epoch}" -ne "$${last_scheduled_epoch}" ]; then
            scheduled_epoch=$${current_midnight_epoch}
          else
            scheduled_epoch=$$((current_midnight_epoch + 86400))
          fi
          wait_seconds=$$((scheduled_epoch - now_epoch))
          echo "[backup] $$(date -u +%Y-%m-%dT%H:%M:%SZ) next backup at 00:00 UTC (in $${wait_seconds}s)"
          sleep "$${wait_seconds}"
          last_scheduled_epoch=$${scheduled_epoch}

          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          backup="$${DB_NAME}-$${ts}.dump"
          temporary="/backups/.$${backup}.tmp"
          echo "[backup] $$(date -u +%Y-%m-%dT%H:%M:%SZ) starting: $${backup}"
          if pg_dump -h "$${DB_HOST}" -p "$${DB_PORT}" -U "$${DB_USER}" -d "$${DB_NAME}" -Fc -f "$${temporary}" &&
             pg_restore --list "$${temporary}" >/dev/null; then
            mv "$${temporary}" "/backups/$${backup}"
            rm -f /backups/.last-failure
            touch /backups/.last-success
            echo "[backup] $$(date -u +%Y-%m-%dT%H:%M:%SZ) backup completed: $${backup}"
          else
            status=$$?
            rm -f "$${temporary}"
            touch /backups/.last-failure
            echo "[backup] $$(date -u +%Y-%m-%dT%H:%M:%SZ) backup failed (status $${status}); next attempt at the next 00:00 UTC" >&2
          fi
        done
    volumes:
      - postgres_backups_beta:/backups
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.92
    healthcheck:
      test:
        - CMD-SHELL
        - |
          test ! -f /backups/.last-failure || exit 1
          reference=$$(stat -c %Y /backups/.scheduler-started)
          if test -f /backups/.last-success; then
            last_success=$$(stat -c %Y /backups/.last-success)
            if test "$${last_success}" -gt "$${reference}"; then
              reference=$${last_success}
            fi
          fi
          age=$$(($$(date -u +%s) - reference))
          test "$${age}" -le "$${BACKUP_HEALTH_MAX_AGE_SECONDS}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: ${BACKUP_HEALTH_START_PERIOD:-2h}
    security_opt:
      - no-new-privileges:true

  # Sentry-compatible error tracking (GlitchTip)
  sentry-postgres-beta:
    image: postgres:15-alpine
    container_name: yamata-sentry-postgres-beta
    restart: unless-stopped
    # Avoid Docker's 64 MiB /dev/shm default for the secondary PostgreSQL.
    shm_size: ${SENTRY_POSTGRES_SHM_SIZE:-2gb}
    environment:
      TZ: UTC
      POSTGRES_DB: ${SENTRY_POSTGRES_DB}
      POSTGRES_USER: ${SENTRY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SENTRY_POSTGRES_PASSWORD}
    volumes:
      - sentry_postgres_data_beta:/var/lib/postgresql/data
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  sentry-redis-beta:
    image: redis:8.0.3-alpine
    container_name: yamata-sentry-redis-beta
    restart: unless-stopped
    volumes:
      - sentry_redis_data_beta:/data
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.13
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  sentry-beta:
    # Pin the tested patch release so routine deploys cannot silently upgrade
    # GlitchTip and its database/frontend assets through the mutable latest tag.
    # image: glitchtip/glitchtip:6.2.2
    image: glitchtip/glitchtip:latest
    container_name: yamata-sentry-beta
    restart: unless-stopped
    depends_on:
      sentry-postgres-beta:
        condition: service_healthy
      sentry-redis-beta:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${SENTRY_POSTGRES_USER}:${SENTRY_POSTGRES_PASSWORD}@sentry-postgres-beta:5432/${SENTRY_POSTGRES_DB}
      REDIS_URL: redis://sentry-redis-beta:6379/0
      SECRET_KEY: ${SENTRY_GLITCHTIP_SECRET_KEY}
      PORT: 8000
      GLITCHTIP_DOMAIN: ${SENTRY_URL_PREFIX}
      ALLOWED_HOSTS: ${SENTRY_ALLOWED_HOSTS}
      # Used by the local health probe as the accepted Django Host header.
      SENTRY_UI_DOMAIN: ${SENTRY_UI_DOMAIN}
      CSRF_TRUSTED_ORIGINS: ${SENTRY_URL_PREFIX}
      DEFAULT_FROM_EMAIL: ${SENTRY_DEFAULT_FROM_EMAIL}
      ENABLE_USER_REGISTRATION: ${SENTRY_ENABLE_USER_REGISTRATION}
      ENABLE_OPEN_USER_REGISTRATION: ${SENTRY_ENABLE_OPEN_USER_REGISTRATION}
      DJANGO_SUPERUSER_USERNAME: ${SENTRY_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_PASSWORD: ${SENTRY_SUPERUSER_PASSWORD}
      DJANGO_SUPERUSER_EMAIL: ${SENTRY_SUPERUSER_EMAIL}
      EMAIL_URL: ${SENTRY_EMAIL_URL}
      SERVER_ROLE: all_in_one
      # Monitor 1 targets a service on this private Compose network.
      GLITCHTIP_UPTIME_ALLOW_PRIVATE_IPS: ${GLITCHTIP_UPTIME_ALLOW_PRIVATE_IPS:-True}
    command: ["./bin/start.sh"]
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.14
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/', headers={'Host': os.environ['SENTRY_UI_DOMAIN']}); urllib.request.urlopen(request, timeout=5).close()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  # Application
  app-beta:
    image: yamata-no-orochi
    container_name: yamata-app-beta
    restart: unless-stopped
    depends_on:
      postgres-beta:
        condition: service_healthy
      redis-beta:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: postgres-beta
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: ${DB_SSL_MODE}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME}
      DB_SLOW_QUERY_LOG: ${DB_SLOW_QUERY_LOG}
      DB_SLOW_QUERY_TIME: ${DB_SLOW_QUERY_TIME}

      # Server Configuration
      SERVER_HOST: ${SERVER_HOST}
      SERVER_PORT: ${SERVER_PORT}
      SERVER_READ_TIMEOUT: ${SERVER_READ_TIMEOUT}
      SERVER_WRITE_TIMEOUT: ${SERVER_WRITE_TIMEOUT}
      SERVER_IDLE_TIMEOUT: ${SERVER_IDLE_TIMEOUT}
      SERVER_SHUTDOWN_TIMEOUT: ${SERVER_SHUTDOWN_TIMEOUT}
      SERVER_BODY_LIMIT: ${SERVER_BODY_LIMIT}
      SERVER_ENABLE_PPROF: ${SERVER_ENABLE_PPROF}
      SERVER_ENABLE_METRICS: ${SERVER_ENABLE_METRICS}
      SERVER_TRUSTED_PROXIES: ${SERVER_TRUSTED_PROXIES}
      SERVER_PROXY_HEADER: ${SERVER_PROXY_HEADER}
      SERVER_ENABLE_COMPRESSION: ${SERVER_ENABLE_COMPRESSION}
      SERVER_COMPRESSION_LEVEL: ${SERVER_COMPRESSION_LEVEL}

      # Security Configuration
      TLS_ENABLED: ${TLS_ENABLED}
      TLS_CERT_FILE: ${TLS_CERT_FILE}
      TLS_KEY_FILE: ${TLS_KEY_FILE}
      TLS_MIN_VERSION: ${TLS_MIN_VERSION}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE}
      HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS}
      HSTS_PRELOAD: ${HSTS_PRELOAD}

      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}
      CORS_MAX_AGE: ${CORS_MAX_AGE}

      # Rate Limiting
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT}
      GLOBAL_RATE_LIMIT: ${GLOBAL_RATE_LIMIT}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW}
      RATE_LIMIT_MEMORY: ${RATE_LIMIT_MEMORY}

      # Content Security Policy
      CSP_POLICY: ${CSP_POLICY}
      X_FRAME_OPTIONS: ${X_FRAME_OPTIONS}
      X_CONTENT_TYPE_OPTIONS: ${X_CONTENT_TYPE_OPTIONS}
      XSS_PROTECTION: ${XSS_PROTECTION}
      REFERRER_POLICY: ${REFERRER_POLICY}

      # API Security
      REQUIRE_API_KEY: ${REQUIRE_API_KEY}
      API_KEY_HEADER: ${API_KEY_HEADER}
      ALLOWED_API_KEYS: ${ALLOWED_API_KEYS}
      IP_WHITELIST: ${IP_WHITELIST}
      IP_BLACKLIST: ${IP_BLACKLIST}

      # Password & Authentication
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH}
      PASSWORD_REQUIRE_UPPER: ${PASSWORD_REQUIRE_UPPER}
      PASSWORD_REQUIRE_LOWER: ${PASSWORD_REQUIRE_LOWER}
      PASSWORD_REQUIRE_NUMBER: ${PASSWORD_REQUIRE_NUMBER}
      PASSWORD_REQUIRE_SYMBOL: ${PASSWORD_REQUIRE_SYMBOL}
      BCRYPT_COST: ${BCRYPT_COST}

      # JWT Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_USE_RSA_KEYS: ${JWT_USE_RSA_KEYS}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ALGORITHM: ${JWT_ALGORITHM}

      # Session Security
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      SESSION_COOKIE_HTTPONLY: ${SESSION_COOKIE_HTTPONLY}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT}
      SESSION_CLEANUP_INTERVAL: ${SESSION_CLEANUP_INTERVAL}

      # SMS Configuration
      SMS_PROVIDER_DOMAIN: ${SMS_PROVIDER_DOMAIN}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_SOURCE_NUMBER: ${SMS_SOURCE_NUMBER}
      SMS_RETRY_COUNT: ${SMS_RETRY_COUNT:-3}
      SMS_VALIDITY_PERIOD: ${SMS_VALIDITY_PERIOD:-300}
      SMS_TIMEOUT: ${SMS_TIMEOUT:-30s}

      # Email Configuration
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM_EMAIL: ${EMAIL_FROM_EMAIL}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      EMAIL_USE_STARTTLS: ${EMAIL_USE_STARTTLS}
      EMAIL_RATE_LIMIT: ${EMAIL_RATE_LIMIT}
      EMAIL_RETRY_ATTEMPTS: ${EMAIL_RETRY_ATTEMPTS}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT}

      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_OUTPUT: ${LOG_OUTPUT}
      LOG_FILE_PATH: ${LOG_FILE_PATH}
      LOG_MAX_SIZE: ${LOG_MAX_SIZE}
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS}
      LOG_MAX_AGE: ${LOG_MAX_AGE}
      LOG_COMPRESS: ${LOG_COMPRESS}
      LOG_ENABLE_CALLER: ${LOG_ENABLE_CALLER}
      LOG_ENABLE_STACKTRACE: ${LOG_ENABLE_STACKTRACE}
      LOG_ENABLE_ACCESS: ${LOG_ENABLE_ACCESS}
      LOG_ACCESS_PATH: ${LOG_ACCESS_PATH}
      LOG_ACCESS_FORMAT: ${LOG_ACCESS_FORMAT}
      LOG_ENABLE_AUDIT: ${LOG_ENABLE_AUDIT}
      LOG_AUDIT_PATH: ${LOG_AUDIT_PATH}
      LOG_ENABLE_SECURITY: ${LOG_ENABLE_SECURITY}
      LOG_SECURITY_PATH: ${LOG_SECURITY_PATH}

      # Metrics Configuration
      METRICS_ENABLED: ${METRICS_ENABLED}
      METRICS_PORT: ${METRICS_PORT}
      METRICS_PATH: ${METRICS_PATH}
      METRICS_ENABLE_PPROF: ${METRICS_ENABLE_PPROF}
      METRICS_PPROF_PORT: ${METRICS_PPROF_PORT}
      METRICS_ENABLE_PROMETHEUS: ${METRICS_ENABLE_PROMETHEUS}
      METRICS_PROMETHEUS_PATH: ${METRICS_PROMETHEUS_PATH}
      METRICS_COLLECT_DB: ${METRICS_COLLECT_DB}
      METRICS_COLLECT_CACHE: ${METRICS_COLLECT_CACHE}
      METRICS_COLLECT_APP: ${METRICS_COLLECT_APP}

      # Ensure libraries that need cache write to tmpfs, not $HOME
      XDG_CACHE_HOME: /tmp

      # Cache Configuration
      CACHE_ENABLED: ${CACHE_ENABLED}
      CACHE_PROVIDER: ${CACHE_PROVIDER}
      CACHE_REDIS_URL: redis://redis-beta:6379
      CACHE_REDIS_DB: ${CACHE_REDIS_DB}
      CACHE_REDIS_PREFIX: ${CACHE_REDIS_PREFIX}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL}
      CACHE_MAX_MEMORY: ${CACHE_MAX_MEMORY}
      CACHE_CLEANUP_INTERVAL: ${CACHE_CLEANUP_INTERVAL}

      # Deployment Configuration
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      MONITORING_DOMAIN: ${MONITORING_DOMAIN}
      SENTRY_UI_DOMAIN: ${SENTRY_UI_DOMAIN}
      SENTRY_URL_PREFIX: ${SENTRY_URL_PREFIX}
      SENTRY_ALLOWED_HOSTS: ${SENTRY_ALLOWED_HOSTS}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
      APP_ENV: ${APP_ENV}
      VERSION: ${VERSION:-1.0.0}
      COMMIT_HASH: ${COMMIT_HASH:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      SENTRY_SERVER_NAME: ${SENTRY_SERVER_NAME}
      SENTRY_TIMEOUT: ${SENTRY_TIMEOUT}
      SENTRY_CAPTURE_4XX: ${SENTRY_CAPTURE_4XX}
      SENTRY_CAPTURE_5XX: ${SENTRY_CAPTURE_5XX}

      # Atipay Configuration
      ATIPAY_API_KEY: ${ATIPAY_API_KEY}
      ATIPAY_TERMINAL: ${ATIPAY_TERMINAL}

      ADMIN_MOBILE: ${ADMIN_MOBILE}
      ADMIN_DEPOSIT_REVIEWER: ${ADMIN_DEPOSIT_REVIEWER}
      ADMIN_2FA_MOBILES: ${ADMIN_2FA_MOBILES}
      ADMIN_OTP_BYPASS_MOBILES: ${ADMIN_OTP_BYPASS_MOBILES}
      ADMIN_LOGIN_OTP_FORWARD_MOBILE: ${ADMIN_LOGIN_OTP_FORWARD_MOBILE}
      SYSTEM_USER_UUID: ${SYSTEM_USER_UUID}
      TAX_USER_UUID: ${TAX_USER_UUID}
      SYSTEM_USER_MOBILE: ${SYSTEM_USER_MOBILE}
      TAX_USER_MOBILE: ${TAX_USER_MOBILE}
      SYSTEM_USER_EMAIL: ${SYSTEM_USER_EMAIL}
      TAX_USER_EMAIL: ${TAX_USER_EMAIL}
      SYSTEM_WALLET_UUID: ${SYSTEM_WALLET_UUID}
      TAX_WALLET_UUID: ${TAX_WALLET_UUID}
      SYSTEM_SHEBA_NUMBER: ${SYSTEM_SHEBA_NUMBER}
      IR_HTTPS_PROXY: ${IR_HTTPS_PROXY}

      # PayamSMS Configuration
      PAYAM_SMS_TOKEN_URL: ${PAYAM_SMS_TOKEN_URL}
      PAYAM_SMS_SYSTEM_NAME: ${PAYAM_SMS_SYSTEM_NAME}
      PAYAM_SMS_USERNAME: ${PAYAM_SMS_USERNAME}
      PAYAM_SMS_PASSWORD: ${PAYAM_SMS_PASSWORD}
      PAYAM_SMS_SCOPE: ${PAYAM_SMS_SCOPE}
      PAYAM_SMS_GRANT_TYPE: ${PAYAM_SMS_GRANT_TYPE}
      PAYAM_SMS_ROOT_ACCESS_TOKEN: ${PAYAM_SMS_ROOT_ACCESS_TOKEN}

      # Bale Configuration
      BALE_API_ACCESS_KEY: ${BALE_API_ACCESS_KEY}
      BALE_PROVIDER: ${BALE_PROVIDER}
      BALE_LEGACY_DOMAIN: ${BALE_LEGACY_DOMAIN}
      BALE_NAJVA_DOMAIN: ${BALE_NAJVA_DOMAIN}

      # Rubika Configuration
      RUBIKA_TOKEN: ${RUBIKA_TOKEN}
      RUBIKA_SERVICE_ID: ${RUBIKA_SERVICE_ID}
      RUBIKA_BASE_URL: ${RUBIKA_BASE_URL}

      # SPlus Configuration
      SPLUS_TOKEN: ${SPLUS_TOKEN}
      SPLUS_BASE_URL: ${SPLUS_BASE_URL}

      # Bot Configuration
      BOT_USERNAME: ${BOT_USERNAME}
      BOT_PASSWORD: ${BOT_PASSWORD}
      BOT_API_DOMAIN: ${BOT_API_DOMAIN}

      # Scheduler Configuration
      CAMPAIGN_EXECUTION_ENABLED: ${CAMPAIGN_EXECUTION_ENABLED}
      CAMPAIGN_EXECUTION_INTERVAL: ${CAMPAIGN_EXECUTION_INTERVAL}
      CAMPAIGN_MESSAGE_SEND_DELAY: ${CAMPAIGN_MESSAGE_SEND_DELAY}
      CAMPAIGN_MESSAGE_SEND_MOCK_ENABLED: ${CAMPAIGN_MESSAGE_SEND_MOCK_ENABLED:-false}
      SMART_TARGETING_CAPACITY_SCHEDULER_ENABLED: ${SMART_TARGETING_CAPACITY_SCHEDULER_ENABLED}
      SMART_TARGETING_TEST_SAMPLING_SCHEDULER_ENABLED: ${SMART_TARGETING_TEST_SAMPLING_SCHEDULER_ENABLED:-${SMART_TARGETING_CAPACITY_SCHEDULER_ENABLED}}
      TAG_TEST_PERFORMANCE_SCHEDULER_ENABLED: ${TAG_TEST_PERFORMANCE_SCHEDULER_ENABLED:-false}
      TAG_TEST_PERFORMANCE_SCHEDULER_INTERVAL: ${TAG_TEST_PERFORMANCE_SCHEDULER_INTERVAL:-1m}
      TAG_TEST_PERFORMANCE_SCHEDULER_BATCH_SIZE: ${TAG_TEST_PERFORMANCE_SCHEDULER_BATCH_SIZE:-25}

      # External Short-Link Configuration
      EXTERNAL_SHORTLINK_ENABLED: ${EXTERNAL_SHORTLINK_ENABLED}
      EXTERNAL_SHORTLINK_BASE_URL: ${EXTERNAL_SHORTLINK_BASE_URL}
      EXTERNAL_SHORTLINK_API_TOKEN: ${EXTERNAL_SHORTLINK_API_TOKEN}
      EXTERNAL_SHORTLINK_CLIENT_CERT_FILE: ${EXTERNAL_SHORTLINK_CLIENT_CERT_FILE}
      EXTERNAL_SHORTLINK_CLIENT_KEY_FILE: ${EXTERNAL_SHORTLINK_CLIENT_KEY_FILE}
      EXTERNAL_SHORTLINK_CA_FILE: ${EXTERNAL_SHORTLINK_CA_FILE}
      EXTERNAL_SHORTLINK_ALLOW_INSECURE_HTTP: ${EXTERNAL_SHORTLINK_ALLOW_INSECURE_HTTP}
      EXTERNAL_SHORTLINK_REQUEST_TIMEOUT: ${EXTERNAL_SHORTLINK_REQUEST_TIMEOUT}
      EXTERNAL_SHORTLINK_MAPPING_SYNC_INTERVAL: ${EXTERNAL_SHORTLINK_MAPPING_SYNC_INTERVAL}
      EXTERNAL_SHORTLINK_CLICK_SYNC_INTERVAL: ${EXTERNAL_SHORTLINK_CLICK_SYNC_INTERVAL}
      EXTERNAL_SHORTLINK_MAPPING_BATCH_SIZE: ${EXTERNAL_SHORTLINK_MAPPING_BATCH_SIZE}
      EXTERNAL_SHORTLINK_CLICK_PAGE_SIZE: ${EXTERNAL_SHORTLINK_CLICK_PAGE_SIZE}
      EXTERNAL_SHORTLINK_MAX_CLICK_PAGES_PER_RUN: ${EXTERNAL_SHORTLINK_MAX_CLICK_PAGES_PER_RUN}

      # Smart Tag Evaluation Configuration
      SMART_TAG_EVALUATION_ENABLED: ${SMART_TAG_EVALUATION_ENABLED}
      SMART_TAG_EVALUATION_SCHEDULER_ENABLED: ${SMART_TAG_EVALUATION_SCHEDULER_ENABLED}
      SMART_TAG_EVALUATION_SCHEDULER_POLL_INTERVAL: ${SMART_TAG_EVALUATION_SCHEDULER_POLL_INTERVAL}
      SMART_TAG_EVALUATION_SCHEDULER_MAX_PARALLEL_RUNS: ${SMART_TAG_EVALUATION_SCHEDULER_MAX_PARALLEL_RUNS}
      SMART_TAG_EVALUATION_DAILY_LIMIT_PER_CUSTOMER: ${SMART_TAG_EVALUATION_DAILY_LIMIT_PER_CUSTOMER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SMART_TAG_EVALUATION_OPENAI_API_KEY_ENV: ${SMART_TAG_EVALUATION_OPENAI_API_KEY_ENV}
      SMART_TAG_EVALUATION_OPENAI_BASE_URL: ${SMART_TAG_EVALUATION_OPENAI_BASE_URL}
      SMART_TAG_EVALUATION_OPENAI_MODEL: ${SMART_TAG_EVALUATION_OPENAI_MODEL}
      SMART_TAG_EVALUATION_OPENAI_REASONING_EFFORT: ${SMART_TAG_EVALUATION_OPENAI_REASONING_EFFORT}
      SMART_TAG_EVALUATION_OPENAI_MAX_OUTPUT_TOKENS: ${SMART_TAG_EVALUATION_OPENAI_MAX_OUTPUT_TOKENS}
      SMART_TAG_EVALUATION_OPENAI_TEMPERATURE: ${SMART_TAG_EVALUATION_OPENAI_TEMPERATURE}
      SMART_TAG_EVALUATION_OPENAI_TIMEOUT: ${SMART_TAG_EVALUATION_OPENAI_TIMEOUT}
      SMART_TAG_EVALUATION_OPENAI_MAX_RETRIES: ${SMART_TAG_EVALUATION_OPENAI_MAX_RETRIES}
      SMART_TAG_EVALUATION_OPENAI_HTTP_PROXY: ${SMART_TAG_EVALUATION_OPENAI_HTTP_PROXY}
      SMART_TAG_EVALUATION_BATCHING_TAG_BATCH_SIZE: ${SMART_TAG_EVALUATION_BATCHING_TAG_BATCH_SIZE}
      SMART_TAG_EVALUATION_VALIDATION_REQUIRE_EXACT_TAG_COUNT: ${SMART_TAG_EVALUATION_VALIDATION_REQUIRE_EXACT_TAG_COUNT}
      SMART_TAG_EVALUATION_VALIDATION_REQUIRE_EXACT_TAG_IDS: ${SMART_TAG_EVALUATION_VALIDATION_REQUIRE_EXACT_TAG_IDS}
      SMART_TAG_EVALUATION_VALIDATION_MAX_MISSING_TAG_COUNT: ${SMART_TAG_EVALUATION_VALIDATION_MAX_MISSING_TAG_COUNT:-1}
      SMART_TAG_EVALUATION_OPENAI_MAX_REQUESTS_PER_MINUTE: ${SMART_TAG_EVALUATION_OPENAI_MAX_REQUESTS_PER_MINUTE}
      SMART_TAG_EVALUATION_BATCHING_MAX_PARALLEL_BATCHES: ${SMART_TAG_EVALUATION_BATCHING_MAX_PARALLEL_BATCHES}

      # Crypto Configuration
      CRYPTO_ENABLED: ${CRYPTO_ENABLED:-true}
      CRYPTO_DEFAULT_PLATFORM: ${CRYPTO_DEFAULT_PLATFORM}
      CRYPTO_SUPPORTED_COINS: ${CRYPTO_SUPPORTED_COINS}
      OXA_BASE_URL: ${OXA_BASE_URL}
      OXA_API_KEY: ${OXA_API_KEY}
      OXA_TIMEOUT: ${OXA_TIMEOUT}

      # Message Configuration
      MESSAGE_SIGNUP_VERIFICATION_CODE_TEMPLATE: ${MESSAGE_SIGNUP_VERIFICATION_CODE_TEMPLATE}
      MESSAGE_SIGNIN_VERIFICATION_CODE_TEMPLATE: ${MESSAGE_SIGNIN_VERIFICATION_CODE_TEMPLATE}
      MESSAGE_OTP_RESEND_VERIFICATION_CODE_TEMPLATE: ${MESSAGE_OTP_RESEND_VERIFICATION_CODE_TEMPLATE}
      MESSAGE_PASSWORD_RESET_VERIFICATION_CODE_TEMPLATE: ${MESSAGE_PASSWORD_RESET_VERIFICATION_CODE_TEMPLATE}
      MESSAGE_CAMPAIGN_REJECTED_TEMPLATE: ${MESSAGE_CAMPAIGN_REJECTED_TEMPLATE}
      MESSAGE_DEPOSIT_RECEIPT_SUBMITTED_TEMPLATE: ${MESSAGE_DEPOSIT_RECEIPT_SUBMITTED_TEMPLATE}
      MESSAGE_INVOICE_ISSUE_REQUEST_TEMPLATE: ${MESSAGE_INVOICE_ISSUE_REQUEST_TEMPLATE}

      HTTPS_PROXY: ''

      CANDOO_SMS_ENABLED: ${CANDOO_SMS_ENABLED}
      CANDOO_SMS_BASE_URL: ${CANDOO_SMS_BASE_URL}
      CANDOO_SMS_API_KEY: ${CANDOO_SMS_API_KEY}
      CANDOO_SMS_MESSAGE_TYPE: ${CANDOO_SMS_MESSAGE_TYPE}
      CANDOO_SMS_RETRY_COUNT: ${CANDOO_SMS_RETRY_COUNT}
      CANDOO_SMS_VALIDITY_PERIOD: ${CANDOO_SMS_VALIDITY_PERIOD}
      CANDOO_SMS_TIMEOUT: ${CANDOO_SMS_TIMEOUT}
      CANDOO_SMS_MAX_REQUESTS_PER_SECOND: ${CANDOO_SMS_MAX_REQUESTS_PER_SECOND}
      CANDOO_SMS_HTTP_MAX_ATTEMPTS: ${CANDOO_SMS_HTTP_MAX_ATTEMPTS}
      CANDOO_SMS_STATUS_MAP: ${CANDOO_SMS_STATUS_MAP}
    volumes:
      - app_logs_beta:/var/log/yamata
      - uploads_beta:/data
      - type: bind
        source: ./SMART_TAG_EVALUATION_PERSONA_ANALYSIS_SYSTEM_PROMPT
        target: /SMART_TAG_EVALUATION_PERSONA_ANALYSIS_SYSTEM_PROMPT
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./SMART_TAG_EVALUATION_TAG_SCORING_SYSTEM_PROMPT
        target: /SMART_TAG_EVALUATION_TAG_SCORING_SYSTEM_PROMPT
        read_only: true
        bind:
          create_host_path: false
    # ports:
    #   - "127.0.0.1:8080:8080"  # Only accessible from localhost
    #   - "127.0.0.1:9090:9090"  # Metrics port
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.20
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "--noproxy",
          "localhost",
          "http://localhost:8080/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache
    user: "appuser"

  # pgAdmin is reachable from nginx only. Its only other network path is the
  # dedicated internal link to PostgreSQL.
  pgadmin-beta:
    # Pin the 9.17 multi-architecture release by OCI index digest. Review and
    # update this reference with the pgAdmin security-release process.
    # image: dpage/pgadmin4:9.17@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    image: dpage/pgadmin4:9.17
    container_name: yamata-pgadmin-beta
    restart: unless-stopped
    depends_on:
      postgres-beta:
        condition: service_healthy
    env_file:
      - ${PGADMIN_ENV_FILE:?PGADMIN_ENV_FILE must point to the protected pgAdmin environment file}
    environment:
      # The email is in PGADMIN_ENV_FILE; the password is a Docker secret.
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_default_password
      PGADMIN_CUSTOM_CONFIG_DISTRO_FILE: /pgadmin4/config_distro.py
      # Apply the reviewed pgAdmin UI defaults when its data volume is first
      # initialized. deploy-beta.sh reapplies these preferences for existing
      # installations as well.
      PGADMIN_PREFERENCES_JSON_FILE: /pgadmin4/preferences.json
      PGADMIN_ALLOWED_HOST: ${PGADMIN_DOMAIN:?PGADMIN_DOMAIN must be set}
      PGADMIN_LISTEN_ADDRESS: 172.31.0.10
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_DISABLE_POSTFIX: "1"
    secrets:
      - source: pgadmin_default_password
        target: pgadmin_default_password
        # Compose file-backed secrets preserve source-file ownership and mode;
        # deploy-beta.sh verifies deployment-user:root, mode 0640.
    volumes:
      - pgadmin_data_beta:/var/lib/pgadmin
      - ./docker/pgadmin/config_distro.py:/pgadmin4/config_distro.py:ro
      - ./docker/pgadmin/preferences.json:/pgadmin4/preferences.json:ro
    networks:
      pgadmin-network-beta:
        ipv4_address: 172.31.0.10
      pgadmin-postgres-network-beta:
        ipv4_address: 172.29.0.3
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c 'import os, urllib.request;
          request=urllib.request.Request("http://172.31.0.10:5050/misc/ping",
          headers={"Host": os.environ["PGADMIN_ALLOWED_HOST"]});
          urllib.request.urlopen(request, timeout=3)'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:uid=5050,gid=5050,mode=1777
      # pgAdmin's default LOG_FILE is under this directory. Keep it writable
      # without weakening the read-only root filesystem or persisting logs.
      - /var/log/pgadmin:uid=5050,gid=0,mode=0750

  # Dedicated proxy for the administrator UI. It is deliberately separate from
  # nginx-beta: pgAdmin may reach this proxy, but this proxy has no route to the
  # application network and can proxy only to pgAdmin.
  pgadmin-nginx-beta:
    build:
      context: docker/nginx
      dockerfile: Dockerfile.edge
    image: yamata-pgadmin-nginx-beta
    container_name: yamata-pgadmin-nginx-beta
    restart: unless-stopped
    depends_on:
      pgadmin-beta:
        condition: service_healthy
    volumes:
      - ./docker/nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./docker/nginx/sites-available/generated/pgadmin:/etc/nginx/sites-available:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/security.conf:/etc/nginx/security.conf:ro
      - ./docker/nginx/gzip.conf:/etc/nginx/gzip.conf:ro
      - ./docker/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - pgadmin_nginx_logs_beta:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    secrets:
      - source: pgadmin_nginx_htpasswd
        target: pgadmin_nginx_htpasswd
        # Compose file-backed secrets preserve source-file ownership and mode;
        # deploy-beta.sh verifies deployment-user:65534, mode 0640.
    ports:
      # Bind only the selected host interface. Never use 0.0.0.0 here:
      # pgAdmin is an administrator-only endpoint.
      - "${PGADMIN_LISTEN_BIND_IP:?PGADMIN_LISTEN_BIND_IP must be a selected host interface address}:14433:14433"
    networks:
      pgadmin-edge-network-beta:
        ipv4_address: 172.28.0.2
      pgadmin-network-beta:
        ipv4_address: 172.31.0.2
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # nginx.conf has defensive default servers on 80/443; this is the only
      # set needed to bind its listeners and initialise request-temp paths.
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      # Nginx creates each temp directory as master, then assigns it to the
      # unprivileged worker user before serving requests.
      - CHOWN
    read_only: true
    tmpfs:
      # Keep the parent writable only by the master; Nginx creates and chowns
      # the child request-temp directories to its unprivileged workers.
      - /var/cache/nginx:uid=0,gid=0,mode=0755
      - /var/run
      - /tmp

  # Nginx Reverse Proxy
  nginx-beta:
    build:
      context: docker/nginx
      dockerfile: Dockerfile.edge
    image: yamata-nginx-beta
    container_name: yamata-nginx-beta
    restart: unless-stopped
    depends_on:
      app-beta:
        condition: service_healthy
      frontend-beta:
        condition: service_healthy
    volumes:
      - ./docker/nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./docker/nginx/sites-available/generated/beta:/etc/nginx/sites-available:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/security.conf:/etc/nginx/security.conf:ro
      - ./docker/nginx/gzip.conf:/etc/nginx/gzip.conf:ro
      - ./docker/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - nginx_logs_beta:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro # Let's Encrypt certificates
      - ./docker/nginx/public:/var/www/jaazebeh:ro # Static site root for jaazebeh.ir
    ports:
      - "80:80"
      - "443:443"
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.30
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "--noproxy",
          "app-beta",
          "http://app-beta:8080/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=65534,gid=65534,mode=0750
      - /var/run
      - /tmp

  nginx-sentry-forwarder-beta:
    build:
      context: scripts
      dockerfile: ../docker/nginx-sentry-forwarder/Dockerfile
    image: yamata-nginx-sentry-forwarder-beta
    container_name: yamata-nginx-sentry-forwarder-beta
    restart: unless-stopped
    depends_on:
      nginx-beta:
        condition: service_healthy
      sentry-beta:
        condition: service_started
    command: ["python", "/app/nginx_sentry_forwarder.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-beta}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-unknown}
      SENTRY_SERVER_NAME: nginx-beta
      SENTRY_TIMEOUT_SECONDS: 5
      SENTRY_PUBLIC_BASE_URL: https://${DOMAIN}
      SENTRY_UI_DOMAIN: ${SENTRY_UI_DOMAIN}
      NGINX_ACCESS_LOG: /var/log/nginx/access.log
      NGINX_ERROR_LOG: /var/log/nginx/error.log
      NGINX_LOG_POLL_INTERVAL_SECONDS: 0.5
      NGINX_SENTRY_FORWARDER_HEALTHCHECK_FILE: /tmp/nginx-sentry-forwarder-last-success
    volumes:
      - nginx_logs_beta:/var/log/nginx:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; path=os.environ['NGINX_SENTRY_FORWARDER_HEALTHCHECK_FILE']; assert time.time()-os.path.getmtime(path) < 90"
      # The deployment script gates completion on this health state. Use a
      # short interval so Engines that do not support `start_interval` do not
      # leave a ready forwarder in `starting` for the 30-second default probe
      # cadence. The probe only stats the local health marker.
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.31
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  cert-monitor-beta:
    build:
      context: scripts
      dockerfile: ../docker/cert-monitor/Dockerfile
    image: yamata-cert-monitor-beta
    container_name: yamata-cert-monitor-beta
    restart: unless-stopped
    depends_on:
      nginx-beta:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      MONITORING_DOMAIN: ${MONITORING_DOMAIN}
      SENTRY_UI_DOMAIN: ${SENTRY_UI_DOMAIN}
      CERT_ALERT_PHONE: ${CERT_ALERT_PHONE}
      CERT_ALERT_THRESHOLD_DAYS: ${CERT_ALERT_THRESHOLD_DAYS:-7}
      CERT_ALERT_CONF_PATH: /etc/nginx/sites-available/yamata.conf
      CERT_ALERT_CONF_GLOBS: /etc/nginx/sites-available/*.conf
      CERT_ALERT_CERT_PATHS: ${CERT_ALERT_CERT_PATHS:-}
      CERT_ALERT_RETRY_INTERVAL: ${CERT_ALERT_RETRY_INTERVAL:-5m}
      SMS_PROVIDER_DOMAIN: ${SMS_PROVIDER_DOMAIN}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_SOURCE_NUMBER: ${SMS_SOURCE_NUMBER}
      SMS_RETRY_COUNT: ${SMS_RETRY_COUNT:-3}
      SMS_VALIDITY_PERIOD: ${SMS_VALIDITY_PERIOD:-300}
      SMS_TIMEOUT: ${SMS_TIMEOUT:-30s}
      PAYAM_SMS_TOKEN_URL: ${PAYAM_SMS_TOKEN_URL:-https://www.payamsms.com/auth/oauth/token}
      PAYAM_SMS_SEND_URL: ${PAYAM_SMS_SEND_URL:-https://www.payamsms.com/panel/webservice/sendMultipleWithSrc}
      PAYAM_SMS_SYSTEM_NAME: ${PAYAM_SMS_SYSTEM_NAME}
      PAYAM_SMS_USERNAME: ${PAYAM_SMS_USERNAME}
      PAYAM_SMS_PASSWORD: ${PAYAM_SMS_PASSWORD}
      PAYAM_SMS_SCOPE: ${PAYAM_SMS_SCOPE:-webservice}
      PAYAM_SMS_GRANT_TYPE: ${PAYAM_SMS_GRANT_TYPE:-password}
      PAYAM_SMS_ROOT_ACCESS_TOKEN: ${PAYAM_SMS_ROOT_ACCESS_TOKEN:-}
    volumes:
      - type: bind
        source: ./docker/nginx/sites-available/generated/beta
        target: /etc/nginx/sites-available
        read_only: true
        bind:
          create_host_path: false
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: ["python", "/app/cert_monitor.py"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; assert time.time()-os.path.getmtime('/tmp/cert-monitor-last-success') < 90000"
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 1m
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.90
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Prometheus (Optional - for monitoring)
  prometheus-beta:
    image: prom/prometheus:v3.5.0
    container_name: yamata-prometheus-beta
    restart: unless-stopped
    volumes:
      - prometheus_data_beta:/prometheus
      - ./docker/prometheus_config.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
    # ports:
    #   - "127.0.0.1:9091:9090"  # Only accessible from localhost
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.40
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    user: "65534:65534" # nobody user

  # Grafana (Optional - for monitoring dashboards)
  grafana-beta:
    build:
      context: docker/grafana
      dockerfile: Dockerfile
    image: yamata-grafana-beta
    container_name: yamata-grafana-beta
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SECURITY_COOKIE_SECURE: true
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: true
      # Let Grafana generate its supported nonce-based CSP; the edge proxy
      # passes this header through for monitoring.${DOMAIN}.
      GF_SECURITY_CONTENT_SECURITY_POLICY: true
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/yamata-overview.json
      GF_SERVER_ROOT_URL: "https://${MONITORING_DOMAIN}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data_beta:/var/lib/grafana
    # ports:
    #   - "127.0.0.1:3000:3000"  # Only accessible from localhost
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.50
    depends_on:
      prometheus-beta:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    user: "472:472" # grafana user

  # Postgres Exporter for DB metrics
  postgres-exporter-beta:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: yamata-postgres-exporter-beta
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres-beta:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}
      DATA_SOURCE_USER: ${DB_USER}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    volumes:
      - ./docker/postgres_exporter/postgres_exporter.yml:/postgres_exporter.yml:ro
    depends_on:
      postgres-beta:
        condition: service_healthy
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.61
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Node Exporter for host metrics
  node-exporter-beta:
    image: prom/node-exporter:v1.10.2
    container_name: yamata-node-exporter-beta
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.70
    healthcheck:
      # Do not probe /metrics here. wget --spider closes that streaming
      # response early, which makes node_exporter log misleading broken pipes.
      # The landing page verifies its HTTP listener without collecting metrics.
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # cAdvisor for container metrics
  cadvisor-beta:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: yamata-cadvisor-beta
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.80

  frontend-beta:
    image: yamata-frontend-beta
    container_name: frontend-beta
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REACT_APP_PRODUCTION_DOMAIN=${DOMAIN:-jazebeh.ir}
      - REACT_APP_ENABLE_ANALYTICS=true
      - REACT_APP_PRIMARY_COLOR=#2563eb
      - REACT_APP_THEME=light
      - REACT_APP_DEFAULT_LANGUAGE=en
      - REACT_APP_SUPPORTED_LANGUAGES=en,fa
    volumes:
      - frontend_logs_beta:/var/log/nginx
      - frontend_logs_beta:/app/logs
    networks:
      yamata-network-beta:
        ipv4_address: 172.30.0.60
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Nginx creates pid and request temp directories here at startup. Keep it
      # writable without depending on the frontend image's exact nginx UID.
      - /var/cache/nginx:mode=1777
      - /var/lib/nginx/tmp:mode=1777
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-beta.rule=Host(`${DOMAIN:-jazebeh.ir}`)"
      - "traefik.http.routers.frontend-beta.entrypoints=websecure"
      - "traefik.http.routers.frontend-beta.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend-beta.loadbalancer.server.port=80"
